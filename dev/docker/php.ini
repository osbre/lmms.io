; LSP uploads: projects, samples and presets.
upload_max_filesize = 64M
post_max_size = 64M

; The image's code never changes under a running container.
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
realpath_cache_ttl = 600

; Sessions sit beside the uploads, so a deploy does not log everyone out.
session.save_path = /app/storage/sessions
